<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roguelike Combat Interface</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="combat-container">
        <div id="player-info">
            <h2>Player</h2>
            <p>Health: <span id="player-health"></span></p>
            <p>Attack: <span id="player-attack"></span></p>
            <p>Defense: <span id="player-defense"></span></p>
        </div>

        <div id="monster-info">
            <h2>monstre: <span id="monster-name"></span></h2>
            <p>Health: <span id="monster-health"></span></p>
            <p>Attack: <span id="monster-attack"></span></p>
            <p>Defense: <span id="monster-defense"></span></p>
        </div>

        <div id="combat-log">
            <h3>Combat Log</h3>
            <pre id="log-output"></pre>
        </div>

        <div id="combat-actions">
            <button id="attack-button">Attack</button>
            <button id="defend-button">Defend</button>
            <button id="run-button">Run</button>
        </div>
    </div>

    <!-- Inclusion des fichiers JavaScript -->
    <script src="src/components/player.js" type="module"></script><!-- Gestion du personnage principal -->
    <script src="src/components/monsters.js" type="module"></script><!-- Gestion des ennemie -->
    <script src="src/components/biome.js" type="module"></script><!-- Gestion des biomes -->
    <script src="src/components/item.js" type="module"></script><!-- Gestion des items -->
    
    <script src="src/systems/combatSystem.js" type="module"></script><!-- Gestion des combats -->
    <script src="src/systems/progressionSystem.js" type="module"></script><!-- Gestion de l'xp/gold etc... -->
    
    <script src="src/ui/hud.js" type="module"></script><!-- Interface de jeu -->
    <script src="src/ui/menu.js" type="module"></script><!-- Interface du menu -->
    <script src="src/ui/dialog.js" type="module"></script><!-- Dialogue de jeu -->

    <script src="src/data/biomes.json"></script><!-- Donnée des biomes -->
    <script src="src/data/monsters.json"></script><!-- donnée des monstres -->
    <script src="src/data/items.json"></script><!-- donnée des items -->

    
    <script src="src/core/game.js" type="module"></script> <!-- Boucle de jeu principale -->
    <script src="src/main.js" type="module"></script> <!-- Point d'entrée principal -->
</body>
</html>
