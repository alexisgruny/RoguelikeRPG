<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roguelike Combat Interface</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="biome-menu" class="menu-container">
        <h2>Choose a Biome</h2>
        <button id="biome1-button"></button>
        <button id="biome2-button"></button>
        <p id='biome-name'></p>
    </div>
        <div id="player-info">
            <h2>Player</h2>
            <p>Health: <span id="player-health"></span></p>
            <p>Attack: <span id="player-attack"></span></p>
            <p>Defense: <span id="player-defense"></span></p>
        </div>

        <div id="monster-info">
            <h2>monstre: <span id="monster-name"></span></h2>
            <p>Health: <span id="monster-health"></span></p>
            <p>Attack: <span id="monster-attack"></span></p>
            <p>Defense: <span id="monster-defense"></span></p>
        </div>

        <div id="combat-log">
            <h3>Combat Log</h3>
            <pre id="log-output"></pre>
        </div>

        <div id="combat-actions">
            <button id="attack-button">Attack</button>
            <button id="skill-button">Compétence</button>
            <button id="items-button">item</button>
        </div>
    </div>

    <!-- Inclusion des fichiers JavaScript -->
    <script src="dist/bundle.js" type="module"></script> <!-- Point d'entrée principal -->
</body>
</html>
